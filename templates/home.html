

{% extends 'base.html' %}

{% block title %}
Home
{% endblock %}

{% block content %}

<div class="card">

    <h1>Xush kelibsiz</h1>
    <br>
    <h2>{{ user.first_name }} {{ user.last_name }}</h2>
    <br>

    {% if user.is_authenticated %}

        {% if user.picture %}
            <img src="{{ user.picture.url }}" width="150">
            <p>{{user.email}}</p>
            <br><br>
            

        {% endif %}

        <br>

        <a href="{% url 'home' %}">
            <button class="btn-view">
                Profile
            </button>
        </a>

        <div style="display:inline-block; gap: 10px;">
            <form action="{% url 'logout' %}" method="POST">
            {% csrf_token %}
                <button class="btn-update" type="submit">Logout</button>
            </form>
        </div>



    {% endif %}

</div>

{% endblock %}
